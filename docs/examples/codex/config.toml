# Codex has no turn-level hook event, so finished turns are reported by the
# `notify` program rather than by a hook. Keep this above any [table].
notify = ["/path/to/coding-agent-notifier/scripts/notifier/agent_notify_wrapper.sh"]

model = "<YOUR_CODEX_MODEL_ID>"
model_reasoning_effort = "high"

[shell_environment_policy.set]
SLACK_BOT_TOKEN = "xoxb-your-token-here"
SLACK_USER_ID = "U12345678"
# For Feishu/Lark custom bot notifications, set one of:
# LARK_WEBHOOK_URL = "https://open.larksuite.com/open-apis/bot/v2/hook/your-token-here"
# FEISHU_WEBHOOK_URL = "https://open.feishu.cn/open-apis/bot/v2/hook/your-token-here"

# Optional:
# DEBUG_AGENT_PAYLOAD = "/tmp/agent_payload.json"   # capture payload used
# ENV_FILE = "/path/to/.env"                        # local env-file fallback

# For Feishu/Lark, point notify at lark_notify.py instead; see
# docs/examples/codex/config_lark.toml.
